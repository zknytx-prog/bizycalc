name: One-time BizyCalc source trust pass

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  trust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add official source notes and remove empty ad wrappers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Remove empty ad wrapper divs left after explicit ad-slot removal.
          pat = re.compile(r'\s*<div style="max-width:(?:728px|920px);margin:[^"]*;padding:[^"]*;text-align:center;">\s*</div>\s*', re.I)
          for p in Path('.').glob('*.html'):
              t=p.read_text(encoding='utf-8')
              t=pat.sub('\n', t)
              p.write_text(t,encoding='utf-8')

          sources = {
            'etsy-fee-calculator.html': '''<div class="explain"><h2>Official source and rate assumptions</h2><p>This calculator uses the standard US Etsy fee assumptions shown above. Etsy's official seller-fee documentation confirms the $0.20 listing fee and 6.5% transaction fee, while payment-processing rates vary by country. Review Etsy's current fee schedule before making pricing decisions: <a href="https://help.etsy.com/hc/en-us/articles/115014483627-What-are-the-Fees-and-Taxes-for-Selling-on-Etsy" rel="noopener" target="_blank">Etsy — Fees and Taxes for Selling</a>. Rates reviewed September 16, 2026.</p></div>''',
            'ebay-fee-calculator.html': '''<div class="explain"><h2>Official source and rate assumptions</h2><p>This calculator uses eBay's common US most-categories final value fee assumption and the current per-order fee thresholds shown above. Category-specific rates and exceptions can differ. Verify your category before listing: <a href="https://www.ebay.com/sellercenter/selling/start-selling-on-ebay/seller-fees" rel="noopener" target="_blank">eBay Seller Center — Seller Fees</a>. Rates reviewed September 16, 2026.</p></div>'''
          }

          for name, block in sources.items():
              p=Path(name)
              t=p.read_text(encoding='utf-8')
              if 'Official source and rate assumptions' not in t:
                  marker='<div class="explain related-tools">'
                  if marker not in t:
                      raise SystemExit(f'Missing related-tools marker in {name}')
                  t=t.replace(marker, block+'\n'+marker,1)
                  p.write_text(t,encoding='utf-8')
          PY

      - name: Validate trust pass
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          failures=[]
          for name in ['etsy-fee-calculator.html','ebay-fee-calculator.html']:
              t=Path(name).read_text(encoding='utf-8')
              if 'Official source and rate assumptions' not in t: failures.append(name+' source block missing')
              if 'target="_blank"' not in t: failures.append(name+' source link missing')
          for p in Path('.').glob('*.html'):
              t=p.read_text(encoding='utf-8')
              if 'class="expanded-info"' in t: failures.append(str(p)+' expanded-info returned')
              if '/all-calculators.html' in t: failures.append(str(p)+' broken old directory link returned')
          if failures:
              print('\n'.join(failures)); sys.exit(1)
          print('PASS: Etsy/eBay official source notes added; no old template contamination or broken directory link found.')
          PY

      - name: Commit and remove workflow
        run: |
          git config user.name "BizyCalc trust bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/source-trust-pass.yml
          git add '*.html'
          git commit -m "Add official fee sources and finish AdSense trust cleanup"
          git push origin HEAD:main
