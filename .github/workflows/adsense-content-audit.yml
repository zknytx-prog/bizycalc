name: One-time BizyCalc AdSense content audit

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit calculator depth and sources
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlparse
          import re

          support={'index.html','about.html','contact.html','privacy-policy.html','terms-of-service.html','disclaimer.html'}
          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.text=[]; self.h2=[]; self.hrefs=[]; self.in_script=0; self.in_style=0; self.curh2=False; self.buf=[]
              def handle_starttag(self,tag,attrs):
                  if tag in ('script','style','noscript'): self.in_script+=1
                  if tag=='h2': self.curh2=True; self.buf=[]
                  if tag=='a':
                      d=dict(attrs)
                      if 'href' in d: self.hrefs.append(d['href'])
              def handle_endtag(self,tag):
                  if tag in ('script','style','noscript') and self.in_script: self.in_script-=1
                  if tag=='h2' and self.curh2:
                      self.h2.append(' '.join(self.buf)); self.curh2=False; self.buf=[]
              def handle_data(self,data):
                  if not self.in_script:
                      self.text.append(data)
                      if self.curh2: self.buf.append(data.strip())

          rows=[]
          for p in sorted(Path('.').glob('*.html')):
              if p.name in support: continue
              parser=P(); parser.feed(p.read_text(encoding='utf-8'))
              text=' '.join(parser.text)
              words=len(re.findall(r"\b[A-Za-z0-9][A-Za-z0-9'’-]*\b",text))
              h2=[re.sub(r'\s+',' ',x).strip() for x in parser.h2]
              ext=[h for h in parser.hrefs if h.startswith(('http://','https://'))]
              sourceish=[h for h in ext if any(k in h.lower() for k in ['amazon','etsy','ebay','paypal','stripe','shopify','wise','gov','irs','tax','cbic','europa','ups','usps','fedex'])]
              method=any(any(k in x.lower() for k in ['how this calculator works','formula','how it works','calculation']) for x in h2)
              example=any('example' in x.lower() for x in h2)
              faq=any('faq' in x.lower() for x in h2)
              rows.append((p.name,words,len(sourceish),method,example,faq,' | '.join(h2)))
          print('FILE\tWORDS\tSOURCES\tMETHOD\tEXAMPLE\tFAQ\tH2')
          for r in rows: print('\t'.join(map(str,r)))
          print('\nSUMMARY')
          print('calculators',len(rows))
          print('under400',sum(r[1]<400 for r in rows))
          print('no_source',sum(r[2]==0 for r in rows))
          print('no_method',sum(not r[3] for r in rows))
          print('no_example',sum(not r[4] for r in rows))
          print('no_faq',sum(not r[5] for r in rows))
          PY
      - name: Remove audit workflow
        run: |
          git config user.name "BizyCalc audit bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/adsense-content-audit.yml
          git commit -m "Remove one-time AdSense content audit workflow"
          git push origin HEAD:main
