name: One-time BizyCalc boilerplate cleanup

on:
  push:
    branches:
      - fix-adsense-bizycalc-2026-09-16

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-adsense-bizycalc-2026-09-16
          fetch-depth: 0

      - name: Remove accidental expanded-info blocks
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          changed = []
          pattern = re.compile(r'\n?<section class="expanded-info"\b.*?</section>\s*', re.S)
          for path in sorted(Path('.').glob('*.html')):
              text = path.read_text(encoding='utf-8')
              new, n = pattern.subn('\n', text)
              if n:
                  path.write_text(new, encoding='utf-8')
                  changed.append((path.name, n))
          print('Changed:', changed)
          if len(changed) != 28:
              raise SystemExit(f'Expected 28 affected HTML files, found {len(changed)}')
          PY

      - name: Validate cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          html = list(Path('.').glob('*.html'))
          failures = []
          for p in html:
              t = p.read_text(encoding='utf-8')
              if 'class="expanded-info"' in t:
                  failures.append(f'{p}: expanded-info remains')
              if '/all-calculators.html' in t:
                  failures.append(f'{p}: dead all-calculators link remains')
              if t.lower().count('<html') != 1 or t.lower().count('</html>') != 1:
                  failures.append(f'{p}: malformed html wrapper')
              if '<meta name="viewport"' not in t and '<meta content="width=device-width' not in t:
                  failures.append(f'{p}: viewport missing')
          if failures:
              print('\n'.join(failures))
              sys.exit(1)
          print(f'Validated {len(html)} HTML files: no expanded-info blocks or dead all-calculators links.')
          PY

      - name: Commit cleanup and remove one-time workflow
        run: |
          git config user.name "BizyCalc cleanup bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/bizycalc-cleanup.yml
          git add '*.html'
          git commit -m "Remove accidental sitewide boilerplate contamination"
          git push origin HEAD:fix-adsense-bizycalc-2026-09-16
