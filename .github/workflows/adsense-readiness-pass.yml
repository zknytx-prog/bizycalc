name: One-time BizyCalc AdSense readiness pass

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply AdSense readiness cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          support = {'about.html','contact.html','privacy-policy.html','terms-of-service.html','disclaimer.html'}
          all_html = sorted(Path('.').glob('*.html'))

          def strip_ad_units(text):
              # Remove rendered ad slots/push calls while preserving the AdSense loader used for ownership/site review.
              text = re.sub(r'\s*<ins\b[^>]*class=["\']adsbygoogle["\'][\s\S]*?</ins>\s*<script>\s*\(adsbygoogle\s*=\s*window\.adsbygoogle\s*\|\|\s*\[\]\)\.push\(\{\}\);\s*</script>\s*', '\n', text, flags=re.I)
              return text

          def remove_adsense_loader(text):
              return re.sub(r'\s*<script\b[^>]*src=["\']https://pagead2\.googlesyndication\.com/pagead/js/adsbygoogle\.js\?client=ca-pub-3736768574278789["\'][^>]*></script>\s*', '\n', text, flags=re.I)

          for p in all_html:
              text = p.read_text(encoding='utf-8')
              text = strip_ad_units(text)
              if p.name in support:
                  text = remove_adsense_loader(text)

              # Remove the cross-site promotional line from the homepage during AdSense review.
              if p.name == 'index.html':
                  text = re.sub(r'\s*<p[^>]*>Need a personal calculator instead\?[\s\S]*?</p>\s*', '\n', text, count=1, flags=re.I)

                  # Add Contact to homepage top navigation if missing.
                  text = text.replace('<a href="/about.html">About</a>\n</nav>', '<a href="/about.html">About</a>\n<a href="/contact.html">Contact</a>\n</nav>')

                  # Replace homepage footer with complete trust navigation.
                  text = re.sub(
                      r'<footer>[\s\S]*?</footer>',
                      '<footer>\n  © 2026 BIZYCALC.COM — FREE TOOLS FOR SMALL BUSINESS OWNERS\n  <br/><a href="/">TOOLS</a> · <a href="/about.html">ABOUT</a> · <a href="/contact.html">CONTACT</a> · <a href="/privacy-policy.html">PRIVACY</a> · <a href="/terms-of-service.html">TERMS</a> · <a href="/disclaimer.html">DISCLAIMER</a>\n</footer>',
                      text, count=1, flags=re.I
                  )

                  # Add substantive publisher context before footer if not already present.
                  if 'How BizyCalc builds and maintains its calculators' not in text:
                      block = '''\n<section class="container" aria-labelledby="methodology-heading" style="margin-top:2rem;margin-bottom:2rem;">\n  <div class="explain">\n    <h2 id="methodology-heading">How BizyCalc builds and maintains its calculators</h2>\n    <p>BizyCalc focuses on practical decisions faced by small-business owners, freelancers, and online sellers. Each calculator is built around a specific question, such as how many units are needed to break even, what a payment processor may deduct from a transaction, or how a target margin changes a selling price. The calculator itself is the primary content: inputs, formulas, and results are designed to make the underlying business math easier to check and compare.</p>\n    <p>For calculators that depend on marketplace fees, tax rules, payment-provider pricing, or other rates that can change, we review the assumptions against provider or government documentation and state when the result is an estimate rather than a quote. Users should verify time-sensitive rates with the relevant provider before making a financial decision. If you find an outdated rate or a calculation issue, the <a href="/contact.html">contact page</a> explains exactly what information to send so we can reproduce and correct it.</p>\n    <p>BizyCalc does not require an account or email address to use its calculators. The calculation fields run in the browser. You can read more about the site's purpose on the <a href="/about.html">About page</a>, how analytics and advertising technology are handled in the <a href="/privacy-policy.html">Privacy Policy</a>, and the limits of calculator outputs in the <a href="/disclaimer.html">Disclaimer</a>.</p>\n  </div>\n</section>\n'''
                      text = text.replace('\n<footer>', block + '\n<footer>', 1)

              # Strengthen calculator navigation and footer without altering calculator logic/content.
              elif p.name not in support:
                  text = re.sub(r'<nav>[\s\S]*?</nav>', '<nav><a href="/">All Tools</a><a href="/about.html">About</a><a href="/contact.html">Contact</a></nav>', text, count=1, flags=re.I)
                  text = re.sub(r'<footer>[\s\S]*?</footer>', '<footer>© 2026 BizyCalc.com — <a href="/">Tools</a> · <a href="/about.html">About</a> · <a href="/contact.html">Contact</a> · <a href="/privacy-policy.html">Privacy</a> · <a href="/terms-of-service.html">Terms</a> · <a href="/disclaimer.html">Disclaimer</a></footer>', text, count=1, flags=re.I)

              p.write_text(text, encoding='utf-8')

          # Sitemap: keep pages intended as search destinations; legal/support pages remain crawlable through site navigation.
          sm = Path('sitemap.xml')
          s = sm.read_text(encoding='utf-8')
          for name in ['about.html','contact.html','privacy-policy.html','terms-of-service.html','disclaimer.html']:
              s = re.sub(rf'\s*<url><loc>https://bizycalc\.com/{re.escape(name)}</loc></url>', '', s)
          sm.write_text(s, encoding='utf-8')
          PY

      - name: Validate site structure and internal links
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit
          import re, sys

          html_files = sorted(Path('.').glob('*.html'))
          existing = {'/' + p.name for p in html_files} | {'/'}
          failures = []
          ad_units = 0

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.hrefs=[]; self.h1=0
              def handle_starttag(self, tag, attrs):
                  d=dict(attrs)
                  if tag == 'a' and 'href' in d: self.hrefs.append(d['href'])
                  if tag == 'h1': self.h1 += 1

          for p in html_files:
              t = p.read_text(encoding='utf-8')
              low = t.lower()
              parser=P(); parser.feed(t)
              if parser.h1 != 1: failures.append(f'{p}: H1 count {parser.h1}')
              if 'name="viewport"' not in low and "name='viewport'" not in low: failures.append(f'{p}: viewport missing')
              if 'class="expanded-info"' in t: failures.append(f'{p}: expanded-info remains')
              if '/all-calculators.html' in t: failures.append(f'{p}: dead all-calculators reference')
              if 'href="#"' in t or "href='#'" in t: failures.append(f'{p}: placeholder href')
              if '<ins' in low and 'adsbygoogle' in low: ad_units += 1
              for href in parser.hrefs:
                  if href.startswith(('#','mailto:','tel:','javascript:')): continue
                  u=urlsplit(href)
                  if u.scheme in ('http','https'): continue
                  path=u.path or '/'
                  if path.endswith('/') and path != '/': continue
                  if path not in existing and not Path(path.lstrip('/')).exists():
                      failures.append(f'{p}: broken internal link {href}')

          for word in ['About the About BizyCalc', 'Zaculators has 250+', 'every calculator on Zaculators']:
              for p in html_files:
                  if word in p.read_text(encoding='utf-8'):
                      failures.append(f'{p}: stale template text: {word}')

          sitemap = Path('sitemap.xml').read_text(encoding='utf-8')
          for legal in ['privacy-policy.html','terms-of-service.html','disclaimer.html','contact.html','about.html']:
              if legal in sitemap: failures.append(f'sitemap still contains support/legal page {legal}')

          if ad_units:
              failures.append(f'{ad_units} explicit AdSense display units remain')

          if failures:
              print('\n'.join(failures)); sys.exit(1)
          print(f'PASS: validated {len(html_files)} HTML files; 0 broken internal links, 0 placeholders, 0 explicit ad units, single H1 and viewport on every page.')
          PY

      - name: Commit changes and remove one-time workflow
        run: |
          git config user.name "BizyCalc readiness bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/adsense-readiness-pass.yml
          git add '*.html' sitemap.xml
          git commit -m "Harden BizyCalc for AdSense site review"
          git push origin HEAD:main
